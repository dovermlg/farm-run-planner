name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Build and audit farming data and route combinations without launching the game
        run: >-
          bash ./gradlew --no-daemon -I tools/reference-export.gradle
          test build verifyFarmingReference verifyRouteCombinations
