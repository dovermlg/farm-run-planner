plugins {
    id 'java'
}

repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}

def runeLiteVersion = findProperty('runeliteVersion') ?: 'latest.release'
group = 'com.classictreerun'
def pluginMetadata = new Properties()
file('runelite-plugin.properties').withInputStream { pluginMetadata.load(it) }
version = pluginMetadata.getProperty('version')

dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}
test { systemProperty 'java.awt.headless', 'true' }
tasks.register('benchmarkInventoryPlanning', JavaExec) {
    group = 'verification'
    description = 'Measure inventory planning offline using test fixtures; does not launch RuneLite.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.classictreerun.InventoryPlanningBenchmark'
    systemProperty 'java.awt.headless', 'true'
}
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.classictreerun.ClassicTreeRunLauncher'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}
